<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interactive M25C anomaly alignment slides and YAML decision compiler.">
  <title>M25C Anomaly Alignment</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #fbfaf7;
      --ink: #15202b;
      --muted: #52606d;
      --rule: #dfe5ea;
      --blue: #2563eb;
      --teal: #0f766e;
      --amber: #b45309;
      --red: #b42318;
      --focus: #93c5fd;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, input, select, textarea { font: inherit; }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    .shell {
      height: 100%;
      display: grid;
      grid-template-rows: 56px minmax(0, 1fr) 64px;
    }

    .topbar,
    .bottombar {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 0 3.3vw;
      background: color-mix(in srgb, var(--paper) 94%, white);
      z-index: 2;
    }

    .topbar { border-bottom: 1px solid var(--rule); }
    .bottombar { border-top: 1px solid var(--rule); justify-content: space-between; }

    .brand {
      color: var(--blue);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .progress-track {
      height: 3px;
      flex: 1;
      background: var(--rule);
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0;
      background: var(--blue);
      transition: width 180ms ease;
    }

    .slide-count {
      min-width: 70px;
      color: var(--muted);
      font-size: 13px;
      text-align: right;
    }

    main {
      min-height: 0;
      overflow: auto;
      scroll-behavior: smooth;
    }

    .slide {
      width: min(1180px, 93vw);
      min-height: 100%;
      margin: 0 auto;
      padding: clamp(28px, 5vh, 62px) 0 44px;
      animation: enter 180ms ease;
    }

    @keyframes enter {
      from { opacity: .4; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .kicker {
      margin: 0 0 16px;
      color: var(--blue);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .035em;
      text-transform: uppercase;
    }

    h1, h2, h3, p { margin-top: 0; }

    h1 {
      max-width: 980px;
      margin-bottom: 32px;
      font-size: clamp(50px, 7.4vw, 92px);
      line-height: .98;
      letter-spacing: -.045em;
    }

    h2 {
      margin-bottom: 16px;
      padding-bottom: 22px;
      border-bottom: 2px solid var(--rule);
      font-size: clamp(34px, 4vw, 54px);
      line-height: 1.05;
      letter-spacing: -.035em;
    }

    h3 {
      margin-bottom: 14px;
      font-size: 22px;
      line-height: 1.15;
    }

    .lede {
      max-width: 900px;
      color: var(--muted);
      font-size: clamp(20px, 2vw, 27px);
      line-height: 1.45;
    }

    .title-slide {
      display: flex;
      min-height: 100%;
      flex-direction: column;
      justify-content: center;
      padding-top: 0;
    }

    .title-slide .lede { margin-bottom: 38px; }

    .date-line {
      color: var(--muted);
      font-size: 15px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(30px, 5vh, 56px) 5vw;
      margin-top: clamp(30px, 5vh, 54px);
    }

    .grid.compact { gap: 32px 5vw; }

    .facet {
      min-width: 0;
      padding-top: 16px;
      border-top: 3px solid var(--rule);
    }

    .facet.history { border-color: var(--blue); }
    .facet.history h3 { color: var(--blue); }
    .facet.canonical { border-color: var(--teal); }
    .facet.canonical h3 { color: var(--teal); }
    .facet.cartography { border-color: var(--amber); }
    .facet.cartography h3 { color: var(--amber); }
    .facet.gameplay { border-color: var(--red); }
    .facet.gameplay h3 { color: var(--red); }

    .facet p {
      color: var(--muted);
      font-size: 18px;
      line-height: 1.45;
    }

    .hypothesis {
      max-width: 1100px;
      margin: 18px 0 0;
      color: var(--muted);
      font-size: clamp(18px, 1.7vw, 23px);
      line-height: 1.4;
    }

    fieldset {
      min-width: 0;
      margin: 0;
      padding: 0;
      border: 0;
    }

    legend {
      width: 100%;
      margin-bottom: 14px;
      font-size: 22px;
      font-weight: 750;
    }

    .history legend { color: var(--blue); }
    .canonical legend { color: var(--teal); }
    .cartography legend { color: var(--amber); }
    .gameplay legend { color: var(--red); }

    .choices {
      display: grid;
      gap: 8px;
    }

    .choice {
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr);
      gap: 9px;
      align-items: start;
      cursor: pointer;
      font-size: 17px;
      line-height: 1.3;
    }

    .choice input { margin: 3px 0 0; accent-color: currentColor; }

    .select-row {
      display: grid;
      grid-template-columns: 140px minmax(0, 1fr);
      align-items: center;
      gap: 12px;
      margin-top: 14px;
      font-size: 15px;
    }

    select, textarea, .text-input {
      width: 100%;
      border: 1px solid #bac4ce;
      border-radius: 0;
      background: white;
      color: var(--ink);
    }

    select, .text-input { min-height: 38px; padding: 7px 10px; }

    textarea {
      min-height: 76px;
      resize: vertical;
      padding: 10px;
      line-height: 1.35;
    }

    .notes {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
      margin-top: 28px;
    }

    .notes label {
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    .notes textarea { margin-top: 7px; }

    .principles {
      display: grid;
      gap: 12px;
      margin-top: 12px;
    }

    .principle {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr);
      gap: 11px;
      align-items: start;
      font-size: 18px;
      line-height: 1.35;
    }

    .principle input { margin-top: 4px; accent-color: var(--blue); }

    .callout {
      margin-top: 38px;
      padding: 18px 0 0;
      border-top: 1px solid var(--rule);
      color: var(--muted);
      font-size: 18px;
      font-weight: 700;
      line-height: 1.4;
    }

    .locked-decisions {
      display: grid;
      gap: 24px;
      margin-top: 4px;
    }

    .locked-decision {
      padding: 0 0 20px;
      border-bottom: 1px solid var(--rule);
    }

    .locked-decision:last-child { border-bottom: 0; }

    .locked-decision strong {
      display: block;
      margin-bottom: 7px;
      color: var(--teal);
      font-size: 24px;
    }

    .locked-decision code {
      display: inline-block;
      margin-bottom: 8px;
      color: var(--ink);
      font: 700 18px/1.2 "SFMono-Regular", Consolas, monospace;
    }

    .locked-decision p {
      margin-bottom: 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.4;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav button,
    .action {
      min-height: 40px;
      border: 1px solid var(--ink);
      border-radius: 0;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      padding: 8px 16px;
      font-weight: 700;
    }

    .nav button.primary,
    .action.primary {
      background: var(--ink);
      color: white;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .35;
    }

    .key-hint {
      color: var(--muted);
      font-size: 13px;
    }

    .status {
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    .yaml-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(280px, .65fr);
      gap: 38px;
      margin-top: 28px;
    }

    .yaml-preview {
      min-height: 440px;
      max-height: 54vh;
      overflow: auto;
      margin: 0;
      padding: 20px;
      border: 1px solid var(--rule);
      background: white;
      color: #273444;
      font: 14px/1.45 "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      white-space: pre;
    }

    .yaml-actions {
      display: grid;
      align-content: start;
      gap: 14px;
    }

    .yaml-actions .action { width: 100%; }

    .completion {
      padding: 18px 0;
      border-top: 3px solid var(--blue);
      border-bottom: 1px solid var(--rule);
    }

    .completion strong {
      display: block;
      margin-bottom: 6px;
      font-size: 34px;
    }

    .completion span {
      color: var(--muted);
      font-size: 15px;
    }

    .warning-list {
      margin: 4px 0 0;
      padding-left: 20px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.45;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 760px) {
      html, body { overflow: auto; }
      .shell { min-height: 100vh; height: auto; grid-template-rows: 52px auto 70px; }
      main { overflow: visible; }
      .slide { width: min(92vw, 680px); min-height: calc(100vh - 122px); padding-top: 34px; }
      .grid, .notes, .yaml-layout { grid-template-columns: 1fr; }
      .grid { gap: 28px; }
      .topbar, .bottombar { padding: 0 4vw; }
      .key-hint { display: none; }
      .brand { max-width: 54vw; overflow: hidden; text-overflow: ellipsis; }
      .yaml-preview { max-height: 55vh; font-size: 12px; }
      h2 { font-size: 36px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto !important; animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">M25C · Anomaly alignment</div>
      <div class="progress-track" aria-hidden="true"><div class="progress-bar" id="progress"></div></div>
      <div class="slide-count" id="slide-count">01 / 15</div>
    </header>

    <main id="deck" tabindex="-1" aria-live="polite"></main>

    <footer class="bottombar">
      <div>
        <div class="status" id="status">0 of 11 anomalies aligned</div>
        <div class="key-hint">Use ← → to navigate · selections save on this device</div>
      </div>
      <nav class="nav" aria-label="Slide navigation">
        <button type="button" id="previous">Previous</button>
        <button type="button" class="primary" id="next">Next</button>
      </nav>
    </footer>
  </div>

  <script>
    const STORAGE_KEY = "m25c-anomaly-alignment-v1";
    const anomalyClasses = [
      "claim", "composite-realm", "concession", "condominium", "dependency",
      "detached-territory", "disputed-area", "enclave-exclave",
      "free-protected-city", "microstate", "non-state-territory"
    ];

    const anomalies = [
      {
        id: "andorra-condominium",
        title: "Andorra: shared sovereignty",
        type: "condominium",
        hypothesis: "A territorially distinct polity under two formally shared superior authorities.",
        canonical: [
          ["one_polity_two_co_sovereigns", "One polity + two co-sovereign relations"],
          ["polity_with_protection", "Polity + external protection relations"],
          ["other", "Another canonical model"]
        ],
        map: [
          ["polygon", "Polygon + dual-authority styling"],
          ["point", "Microstate point or inset at small scales"],
          ["metadata_only", "Merge visually; retain canonical metadata"]
        ],
        game: [
          ["nonplayable_entity", "Separate non-playable entity"],
          ["playable_entity", "Playable microstate profile"],
          ["relationship", "Relationship or diplomatic mechanic"],
          ["merge", "Merge into a gameplay province"]
        ]
      },
      {
        id: "athos-monastic-territory",
        title: "Mount Athos: monastic autonomy",
        type: "non-state-territory",
        hypothesis: "A durable territorial monastic community with autonomy inside a larger imperial sphere.",
        canonical: [
          ["territory_with_monastic_administrator", "Territory + monastic administrator"],
          ["autonomous_subdivision", "Autonomous subdivision of the host polity"],
          ["institution_only", "Institution without separate territory"],
          ["other", "Another canonical model"]
        ],
        map: [
          ["polygon", "Distinct polygon and boundary"],
          ["hatch", "Overlay or hatch inside host territory"],
          ["point", "Point or label only"],
          ["metadata_only", "Metadata only"]
        ],
        game: [
          ["nonplayable_entity", "Non-playable territorial entity"],
          ["modifier", "Autonomy modifier on host province"],
          ["relationship", "Religious institution mechanic"],
          ["none", "No separate gameplay object"]
        ]
      },
      {
        id: "avignon-papal-enclave",
        title: "Avignon: papal enclave",
        type: "enclave-exclave",
        hypothesis: "Papal territory separated from the principal Papal States and surrounded by another realm.",
        canonical: [
          ["papal_ownership_detached_geometry", "Papal ownership + detached geometry"],
          ["papal_dependency", "Papal dependency relationship"],
          ["revised_scope", "Revise the territorial scope"],
          ["other", "Another canonical model"]
        ],
        map: [
          ["polygon", "Full enclave polygon"],
          ["outline", "Boundary + papal fill"],
          ["inset", "Inset or symbol at small scales"],
          ["metadata_only", "Merge visually; retain ownership"]
        ],
        game: [
          ["province", "Papal-owned province"],
          ["nonplayable_entity", "Papal dependency"],
          ["modifier", "Enclave modifier or access rules"],
          ["merge", "Merge into host gameplay province"]
        ]
      },
      {
        id: "burgundian-composite-realm",
        title: "Burgundy: a composite realm",
        type: "composite-realm",
        hypothesis: "Multiple constitutional territories shared a ruler while retaining distinct laws or institutions.",
        canonical: [
          ["one_ruler_multiple_polities", "One ruler + multiple constituent polities"],
          ["one_polity_autonomous_territories", "One polity + autonomous territories"],
          ["unified_realm", "Ordinary unified realm"],
          ["other", "Another canonical model"]
        ],
        map: [
          ["outline", "Shared dynasty color + internal boundaries"],
          ["polygon", "Constituent-polity colors"],
          ["hatch", "Unified fill + hierarchy overlay"],
          ["metadata_only", "Profile-controlled simplification"]
        ],
        game: [
          ["playable_entity", "One tag with constituent mechanics"],
          ["relationship", "Personal-union style entities"],
          ["nonplayable_entity", "Subjects under a lead polity"],
          ["merge", "Unified realm with metadata only"]
        ]
      },
      {
        id: "calais-english-detached",
        title: "Calais: detached English territory",
        type: "detached-territory",
        hypothesis: "English-controlled land geographically detached from England and embedded in French territory.",
        canonical: [
          ["english_ownership_control", "English ownership and control"],
          ["city_and_pale", "Distinguish the city from the Pale"],
          ["qualified_control", "Contested or qualified control"],
          ["other", "Another canonical model"]
        ],
        map: [
          ["polygon", "English polygon + detached marker"],
          ["inset", "Enclave outline or inset"],
          ["outline", "Owner fill without special styling"],
          ["metadata_only", "Merge at small scales"]
        ],
        game: [
          ["province", "English-owned province"],
          ["modifier", "Fortified enclave mechanic"],
          ["claim", "Strategic port or claim only"],
          ["merge", "Merge while retaining owner metadata"]
        ]
      },
      {
        id: "ceuta-portuguese-marinid-dispute",
        title: "Ceuta: possession and restitution dispute",
        type: "disputed-area",
        hypothesis: "Portuguese possession coexisted with a politically meaningful dispute over promised surrender.",
        canonical: [
          ["portugal_controls_morocco_claims", "Portugal owns and controls; Morocco claims"],
          ["bilateral_dispute", "Active bilateral dispute relation"],
          ["possession_no_live_dispute", "Possession without a live dispute"],
          ["other", "Needs a narrower date or legal finding"]
        ],
        map: [
          ["hatch", "Owner fill + dispute hatch"],
          ["label", "Dual-label or claim overlay"],
          ["metadata_only", "Ownership only; dispute in inspector"],
          ["outline", "Uncertain treatment pending evidence"]
        ],
        game: [
          ["claim", "Portuguese ownership + Moroccan claim"],
          ["modifier", "Contested province mechanic"],
          ["event", "Diplomatic issue or event only"],
          ["none", "No special gameplay treatment"]
        ]
      },
      {
        id: "galata-genoese-concession",
        title: "Galata: Genoese concession",
        type: "concession",
        hypothesis: "Genoese jurisdiction and privileges formed a territorial concession within Constantinople.",
        canonical: [
          ["host_sovereignty_genoese_jurisdiction", "Host sovereignty + Genoese jurisdiction"],
          ["genoese_dependency", "Genoese dependency or colony"],
          ["commercial_privileges_only", "Commercial privileges without territory"],
          ["other", "Another canonical model"]
        ],
        map: [
          ["polygon", "Small concession polygon"],
          ["hatch", "Jurisdiction overlay inside the host city"],
          ["point", "Point or port symbol"],
          ["metadata_only", "Metadata only"]
        ],
        game: [
          ["relationship", "Trade enclave mechanic"],
          ["province", "Genoese-controlled subprovince"],
          ["modifier", "Modifier on host province"],
          ["event", "Event or flavor only"]
        ]
      },
      {
        id: "lancastrian-french-crown-claim",
        title: "Lancastrian claim to France",
        type: "claim",
        hypothesis: "A formal crown claim remained distinct from actual territorial ownership and control.",
        canonical: [
          ["claimant_to_crown", "Claimant-to-crown relationship"],
          ["defined_territorial_claims", "Claims on defined territories"],
          ["title_metadata_only", "Title metadata only"],
          ["expired", "Revise or expire the claim"]
        ],
        map: [
          ["hatch", "No ownership change; claim overlay"],
          ["outline", "Optional diplomatic layer"],
          ["metadata_only", "Inspector or tooltip only"],
          ["inset", "Historical narrative inset"]
        ],
        game: [
          ["claim", "Crown or title claim mechanic"],
          ["province", "Territorial claims or cores"],
          ["event", "War-goal or event chain"],
          ["none", "Flavor only"]
        ]
      },
      {
        id: "lubeck-free-imperial-city",
        title: "Lübeck: free imperial city",
        type: "free-protected-city",
        hypothesis: "Civic autonomy and imperial immediacy justify a distinct city-polity relationship.",
        canonical: [
          ["autonomous_polity_in_empire", "Autonomous polity within the Empire"],
          ["imperial_free_city_status", "Imperial subject or free-city status"],
          ["ordinary_city", "Ordinary city in a larger polity"],
          ["other", "Another canonical model"]
        ],
        map: [
          ["polygon", "City polygon + free-city styling"],
          ["point", "Point symbol at small scales"],
          ["outline", "Imperial fill + autonomy outline"],
          ["metadata_only", "Merge visually; retain status"]
        ],
        game: [
          ["playable_entity", "Playable free-city entity"],
          ["nonplayable_entity", "Non-playable imperial subject"],
          ["modifier", "Autonomy or trade modifier"],
          ["merge", "Merge into gameplay province"]
        ]
      },
      {
        id: "madeira-portuguese-dependency",
        title: "Madeira: Portuguese dependency",
        type: "dependency",
        hypothesis: "Portuguese sovereignty operated through donatary captaincies rather than ordinary metropolitan administration.",
        canonical: [
          ["dependency_with_captaincies", "Dependency + captaincy administration"],
          ["normal_portuguese_territory", "Normal Portuguese territory"],
          ["multiple_captaincies", "Multiple captaincy entities"],
          ["other", "Another canonical model"]
        ],
        map: [
          ["outline", "Portuguese fill + dependency outline"],
          ["polygon", "Ordinary owner fill"],
          ["inset", "Island label or inset"],
          ["metadata_only", "Profile-controlled distinction"]
        ],
        game: [
          ["province", "Portuguese province + dependency modifier"],
          ["nonplayable_entity", "Colonial subject or entity"],
          ["modifier", "Captaincy mechanics"],
          ["merge", "Ordinary province"]
        ]
      },
      {
        id: "san-marino-microstate",
        title: "San Marino: persistent microstate",
        type: "microstate",
        hypothesis: "A very small self-governing polity should remain canonically distinct even when maps cannot show its polygon.",
        canonical: [
          ["independent_polity", "Independent polity"],
          ["protected_autonomous_polity", "Protected or autonomous polity"],
          ["territorial_community", "Territorial community without full sovereignty"],
          ["other", "Another canonical model"]
        ],
        map: [
          ["polygon", "Polygon at detailed zoom"],
          ["point", "Point or label at world scale"],
          ["inset", "Inset for print maps"],
          ["metadata_only", "Merge visually; retain metadata"]
        ],
        game: [
          ["playable_entity", "Playable microstate profile"],
          ["nonplayable_entity", "Non-playable entity"],
          ["relationship", "Relationship or modifier only"],
          ["merge", "Merge into gameplay province"]
        ]
      }
    ];

    const blankState = {
      slide: 0,
      global: {
        canonicalPriority: true,
        preserveWhenScalePermits: true,
        explicitLossiness: true,
        retainCanonicalIds: true,
        exposeUncertainty: true,
        subprovinceEntities: true,
        smallScale: "symbolize",
        minimumRetention: "nested_entity",
        consumerOverridesAllowed: true,
        overrideScope: "projection_only",
        overrideRequiresLossiness: true,
        canonicalHistoryMutableByConsumers: false,
        notes: ""
      },
      anomalies: Object.fromEntries(anomalies.map(item => [item.id, {
        historical: null,
        class: item.type,
        confidence: null,
        canonical: null,
        canonicalOther: "",
        cartography: [],
        smallScale: null,
        gameplay: [],
        singleOwnerFallback: "",
        lossiness: "",
        notes: ""
      }]))
    };

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function loadState() {
      try {
        const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (!parsed || typeof parsed !== "object") return clone(blankState);
        const next = clone(blankState);
        Object.assign(next.global, parsed.global || {});
        next.global.canonicalPriority = true;
        next.global.preserveWhenScalePermits = true;
        next.global.explicitLossiness = true;
        next.global.retainCanonicalIds = true;
        next.global.exposeUncertainty = true;
        next.global.subprovinceEntities = true;
        next.global.smallScale = "symbolize";
        next.global.minimumRetention = "nested_entity";
        next.global.consumerOverridesAllowed = true;
        next.global.overrideScope = "projection_only";
        next.global.overrideRequiresLossiness = true;
        next.global.canonicalHistoryMutableByConsumers = false;
        for (const item of anomalies) Object.assign(next.anomalies[item.id], parsed.anomalies?.[item.id] || {});
        next.slide = Number.isInteger(parsed.slide) ? parsed.slide : 0;
        return next;
      } catch {
        return clone(blankState);
      }
    }

    let state = loadState();
    const totalSlides = anomalies.length + 4;
    state.slide = Math.max(0, Math.min(totalSlides - 1, state.slide));

    const deck = document.getElementById("deck");
    const progress = document.getElementById("progress");
    const count = document.getElementById("slide-count");
    const status = document.getElementById("status");
    const previous = document.getElementById("previous");
    const next = document.getElementById("next");

    function save() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
      updateChrome();
    }

    function alignedCount() {
      return anomalies.filter(item => {
        const answer = state.anomalies[item.id];
        return Boolean(answer.historical && answer.canonical);
      }).length;
    }

    function updateChrome() {
      progress.style.width = `${((state.slide + 1) / totalSlides) * 100}%`;
      count.textContent = `${String(state.slide + 1).padStart(2, "0")} / ${String(totalSlides).padStart(2, "0")}`;
      const aligned = alignedCount();
      status.textContent = `${aligned} of ${anomalies.length} anomalies aligned`;
      previous.disabled = state.slide === 0;
      next.textContent = state.slide === totalSlides - 1 ? "Back to start" : "Next";
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function checked(condition) { return condition ? "checked" : ""; }
    function selected(condition) { return condition ? "selected" : ""; }

    function radioChoices(name, values, current) {
      return `<div class="choices">${values.map(([value, label]) => `
        <label class="choice">
          <input type="radio" name="${escapeHtml(name)}" value="${escapeHtml(value)}" ${checked(current === value)}>
          <span>${escapeHtml(label)}</span>
        </label>`).join("")}</div>`;
    }

    function checkChoices(name, values, current) {
      return `<div class="choices">${values.map(([value, label]) => `
        <label class="choice">
          <input type="checkbox" name="${escapeHtml(name)}" value="${escapeHtml(value)}" ${checked(current.includes(value))}>
          <span>${escapeHtml(label)}</span>
        </label>`).join("")}</div>`;
    }

    function renderTitle() {
      return `<section class="slide title-slide" aria-labelledby="slide-title">
        <p class="kicker">M25C · Decision workbook</p>
        <h1 id="slide-title">One historical truth.<br>Many valid projections.</h1>
        <p class="lede">Align the 11 anomaly findings across canonical data, cartography, and gameplay—then return one YAML response.</p>
        <p class="date-line">1444-11-11 · pending review</p>
      </section>`;
    }

    function renderModel() {
      return `<section class="slide" aria-labelledby="model-title">
        <p class="kicker">Alignment model</p>
        <h2 id="model-title">Separate facts from projections</h2>
        <p class="lede">The census should settle historical semantics. Product profiles may simplify them without rewriting the evidence.</p>
        <div class="grid">
          <article class="facet history"><h3>1 · Historical finding</h3><p>Date-valid facts, actors, rights, control, claims, uncertainty, and evidence.</p></article>
          <article class="facet canonical"><h3>2 · Canonical model</h3><p>Engine-neutral entities, territories, authority relations, legal status, and date ranges.</p></article>
          <article class="facet cartography"><h3>3 · Cartographic profile</h3><p>Polygon, outline, hatch, point, label, inset, zoom behavior, and uncertainty styling.</p></article>
          <article class="facet gameplay"><h3>4 · Product projection</h3><p>Province, nested city or site, playable entity, relationship, building, modifier, event, or documented merge.</p></article>
        </div>
      </section>`;
    }

    function renderDefaults() {
      const g = state.global;
      const principles = [
        ["canonicalPriority", "Canonical layer maximizes historical fidelity"],
        ["preserveWhenScalePermits", "Maps preserve anomalies when scale permits"],
        ["explicitLossiness", "Games may simplify with explicit lossiness"],
        ["retainCanonicalIds", "Every simplification retains canonical IDs"],
        ["exposeUncertainty", "Uncertainty is visible, not silently resolved"],
        ["subprovinceEntities", "A province is a projection unit, not the canonical floor"]
      ];
      return `<section class="slide" aria-labelledby="defaults-title">
        <p class="kicker">Global defaults</p>
        <h2 id="defaults-title">Template defaults; product projections may override</h2>
        <div class="grid compact">
          <fieldset class="facet history">
            <legend>Canonical guarantees</legend>
            <div class="principles">${principles.map(([key, label]) => `
              <label class="principle">
                <input type="checkbox" data-global="${key}" checked disabled>
                <span>${label}</span>
              </label>`).join("")}</div>
          </fieldset>
          <fieldset class="facet canonical">
            <legend>Locked projection defaults</legend>
            <div class="locked-decisions">
              <div class="locked-decision">
                <strong>Small-scale maps</strong>
                <code>symbolize</code>
                <p>Use a point, label, inset, or minimum-size symbol when canonical geometry cannot be drawn legibly.</p>
              </div>
              <div class="locked-decision">
                <strong>Minimum retained representation</strong>
                <code>nested_entity</code>
                <p>Keep a stable subprovince city, site, enclave, institution, or microterritory that products can promote or simplify.</p>
              </div>
              <div class="locked-decision">
                <strong>Consumer overrides</strong>
                <code>projection_only</code>
                <p>Games may override rendering and mechanics, but must retain canonical IDs, disclose lossiness, and leave accepted history unchanged.</p>
              </div>
            </div>
            <label class="select-row"><span>Notes</span>
              <input class="text-input" data-global="notes" value="${escapeHtml(g.notes)}" placeholder="Optional global guidance">
            </label>
          </fieldset>
        </div>
        <p class="callout">The template supplies lossless canonical data and recommended fallbacks. Each game owns its projection profile; no game may silently rewrite the accepted historical layer.</p>
      </section>`;
    }

    function renderAnomaly(item, index) {
      const answer = state.anomalies[item.id];
      const historical = [
        ["accept", "Accept the current finding"],
        ["revise", "Revise its class or scope"],
        ["reject", "Reject the anomaly"],
        ["needs_evidence", "Needs more evidence"]
      ];
      const confidence = ["high", "medium", "low"];
      const smallScale = ["preserve", "symbolize", "merge", "omit"];
      return `<section class="slide" aria-labelledby="anomaly-title">
        <p class="kicker">${String(index + 1).padStart(2, "0")} · ${escapeHtml(item.type)}</p>
        <h2 id="anomaly-title">${escapeHtml(item.title)}</h2>
        <p class="hypothesis"><strong>Current hypothesis:</strong> ${escapeHtml(item.hypothesis)}</p>
        <div class="grid compact">
          <fieldset class="facet history">
            <legend>Historical decision</legend>
            ${radioChoices(`${item.id}:historical`, historical, answer.historical)}
            <label class="select-row"><span>Class</span>
              <select data-field="class">
                ${anomalyClasses.map(value => `<option value="${value}" ${selected(answer.class === value)}>${value}</option>`).join("")}
              </select>
            </label>
            <label class="select-row"><span>Confidence</span>
              <select data-field="confidence">
                <option value="">Choose…</option>
                ${confidence.map(value => `<option ${selected(answer.confidence === value)}>${value}</option>`).join("")}
              </select>
            </label>
          </fieldset>
          <fieldset class="facet canonical">
            <legend>Canonical model</legend>
            ${radioChoices(`${item.id}:canonical`, item.canonical, answer.canonical)}
            <label class="select-row"><span>Other model</span>
              <input class="text-input" data-field="canonicalOther" value="${escapeHtml(answer.canonicalOther)}" placeholder="Describe if selected">
            </label>
          </fieldset>
          <fieldset class="facet cartography">
            <legend>Cartographic options</legend>
            ${checkChoices(`${item.id}:cartography`, item.map, answer.cartography)}
            <label class="select-row"><span>Small scale</span>
              <select data-field="smallScale">
                <option value="">Use global default</option>
                ${smallScale.map(value => `<option ${selected(answer.smallScale === value)}>${value}</option>`).join("")}
              </select>
            </label>
          </fieldset>
          <fieldset class="facet gameplay">
            <legend>Gameplay options</legend>
            ${checkChoices(`${item.id}:gameplay`, item.game, answer.gameplay)}
            <label class="select-row"><span>Single-owner fallback</span>
              <input class="text-input" data-field="singleOwnerFallback" value="${escapeHtml(answer.singleOwnerFallback)}" placeholder="Optional polity ID or rule">
            </label>
          </fieldset>
        </div>
        <div class="notes">
          <label>Lossiness note
            <textarea data-field="lossiness" placeholder="Required when a profile merges or omits this anomaly">${escapeHtml(answer.lossiness)}</textarea>
          </label>
          <label>Decision notes
            <textarea data-field="notes" placeholder="Corrections, rationale, or follow-up evidence">${escapeHtml(answer.notes)}</textarea>
          </label>
        </div>
      </section>`;
    }

    function yamlScalar(value) {
      if (value === null || value === undefined || value === "") return "null";
      if (typeof value === "boolean") return value ? "true" : "false";
      return JSON.stringify(String(value));
    }

    function yamlList(values) {
      return `[${values.map(yamlScalar).join(", ")}]`;
    }

    function compileYaml() {
      const g = state.global;
      const lines = [
        "schema_version: \"1.0.0\"",
        "pass_id: \"official-1444-global-v1\"",
        "start_date: \"1444-11-11\"",
        "global:",
        `  canonical_priority: ${g.canonicalPriority ? "\"historical_fidelity\"" : "null"}`,
        `  preserve_when_scale_permits: ${g.preserveWhenScalePermits}`,
        `  explicit_lossiness: ${g.explicitLossiness}`,
        `  retain_canonical_ids_when_simplified: ${g.retainCanonicalIds}`,
        `  expose_uncertainty: ${g.exposeUncertainty}`,
        `  default_small_scale_policy: ${yamlScalar(g.smallScale)}`,
        `  default_minimum_retention: ${yamlScalar(g.minimumRetention)}`,
        `  province_is_canonical_floor: false`,
        `  preserve_subprovince_entities: ${g.subprovinceEntities}`,
        `  consumer_projection_overrides_allowed: ${g.consumerOverridesAllowed}`,
        `  override_scope: ${yamlScalar(g.overrideScope)}`,
        `  override_requires_lossiness_note: ${g.overrideRequiresLossiness}`,
        `  override_must_retain_canonical_ids: true`,
        `  canonical_history_mutable_by_consumers: ${g.canonicalHistoryMutableByConsumers}`,
        `  notes: ${yamlScalar(g.notes)}`,
        "anomalies:"
      ];
      for (const item of anomalies) {
        const a = state.anomalies[item.id];
        lines.push(
          `  ${item.id}:`,
          "    historical:",
          `      decision: ${yamlScalar(a.historical)}`,
          `      class: ${yamlScalar(a.class)}`,
          `      confidence: ${yamlScalar(a.confidence)}`,
          "    canonical:",
          `      model: ${yamlScalar(a.canonical)}`,
          `      other: ${yamlScalar(a.canonicalOther)}`,
          "    cartography:",
          `      representations: ${yamlList(a.cartography)}`,
          `      small_scale: ${yamlScalar(a.smallScale || g.smallScale)}`,
          "    gameplay:",
          `      projections: ${yamlList(a.gameplay)}`,
          `      single_owner_fallback: ${yamlScalar(a.singleOwnerFallback)}`,
          `    lossiness_note: ${yamlScalar(a.lossiness)}`,
          `    notes: ${yamlScalar(a.notes)}`
        );
      }
      return lines.join("\n") + "\n";
    }

    function warnings() {
      const missing = [];
      for (const item of anomalies) {
        const a = state.anomalies[item.id];
        if (!a.historical) missing.push(`${item.id}: historical decision`);
        if (!a.canonical) missing.push(`${item.id}: canonical model`);
        if ((a.cartography.includes("metadata_only") || a.gameplay.includes("merge")) && !a.lossiness.trim()) {
          missing.push(`${item.id}: lossiness note`);
        }
      }
      return missing;
    }

    function renderExport() {
      const yaml = compileYaml();
      const issues = warnings();
      return `<section class="slide" aria-labelledby="export-title">
        <p class="kicker">Handoff</p>
        <h2 id="export-title">Return one YAML decision contract</h2>
        <div class="yaml-layout">
          <pre class="yaml-preview" id="yaml-preview" tabindex="0">${escapeHtml(yaml)}</pre>
          <aside class="yaml-actions">
            <div class="completion">
              <strong>${alignedCount()} / ${anomalies.length}</strong>
              <span>anomalies have historical and canonical decisions</span>
            </div>
            <button class="action primary" id="copy-yaml" type="button">Copy YAML</button>
            <button class="action" id="download-yaml" type="button">Download YAML</button>
            <button class="action" id="reset" type="button">Reset all selections</button>
            ${issues.length ? `<div>
              <strong>Still needed</strong>
              <ul class="warning-list">${issues.map(issue => `<li>${escapeHtml(issue)}</li>`).join("")}</ul>
            </div>` : `<p class="callout">All required selections are complete. The YAML is ready to return.</p>`}
          </aside>
        </div>
      </section>`;
    }

    function render() {
      if (state.slide === 0) deck.innerHTML = renderTitle();
      else if (state.slide === 1) deck.innerHTML = renderModel();
      else if (state.slide === 2) deck.innerHTML = renderDefaults();
      else if (state.slide < totalSlides - 1) deck.innerHTML = renderAnomaly(anomalies[state.slide - 3], state.slide - 3);
      else deck.innerHTML = renderExport();

      bindSlide();
      deck.scrollTop = 0;
      updateChrome();
      document.title = `${String(state.slide + 1).padStart(2, "0")} · M25C Anomaly Alignment`;
    }

    function bindSlide() {
      deck.querySelectorAll("[data-global]").forEach(control => {
        const key = control.dataset.global;
        control.addEventListener("change", () => {
          if (control.type === "checkbox") state.global[key] = control.checked;
          else if (control.type === "text") state.global[key] = control.value;
          else state.global[key] = control.value || null;
          save();
        });
        if (control.tagName === "INPUT" && control.type === "text") {
          control.addEventListener("input", () => { state.global[key] = control.value; save(); });
        }
      });

      if (state.slide >= 3 && state.slide < totalSlides - 1) {
        const item = anomalies[state.slide - 3];
        const answer = state.anomalies[item.id];
        deck.querySelectorAll(`input[name="${item.id}:historical"]`).forEach(control => {
          control.addEventListener("change", () => { answer.historical = control.value; save(); });
        });
        deck.querySelectorAll(`input[name="${item.id}:canonical"]`).forEach(control => {
          control.addEventListener("change", () => { answer.canonical = control.value; save(); });
        });
        deck.querySelectorAll(`input[name="${item.id}:cartography"]`).forEach(control => {
          control.addEventListener("change", () => {
            answer.cartography = [...deck.querySelectorAll(`input[name="${item.id}:cartography"]:checked`)].map(node => node.value);
            save();
          });
        });
        deck.querySelectorAll(`input[name="${item.id}:gameplay"]`).forEach(control => {
          control.addEventListener("change", () => {
            answer.gameplay = [...deck.querySelectorAll(`input[name="${item.id}:gameplay"]:checked`)].map(node => node.value);
            save();
          });
        });
        deck.querySelectorAll("[data-field]").forEach(control => {
          const key = control.dataset.field;
          const event = control.tagName === "SELECT" ? "change" : "input";
          control.addEventListener(event, () => {
            answer[key] = control.tagName === "SELECT" ? (control.value || null) : control.value;
            save();
          });
        });
      }

      document.getElementById("copy-yaml")?.addEventListener("click", async event => {
        const yaml = compileYaml();
        try {
          await navigator.clipboard.writeText(yaml);
        } catch {
          const area = document.createElement("textarea");
          area.value = yaml;
          document.body.append(area);
          area.select();
          document.execCommand("copy");
          area.remove();
        }
        event.currentTarget.textContent = "Copied";
        setTimeout(() => { event.currentTarget.textContent = "Copy YAML"; }, 1400);
      });

      document.getElementById("download-yaml")?.addEventListener("click", () => {
        const blob = new Blob([compileYaml()], { type: "application/yaml;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "m25c-anomaly-alignment-response.yaml";
        link.click();
        URL.revokeObjectURL(url);
      });

      document.getElementById("reset")?.addEventListener("click", () => {
        if (!confirm("Reset every alignment selection?")) return;
        state = clone(blankState);
        save();
        render();
      });
    }

    function go(delta) {
      if (state.slide === totalSlides - 1 && delta > 0) state.slide = 0;
      else state.slide = Math.max(0, Math.min(totalSlides - 1, state.slide + delta));
      save();
      render();
      deck.focus({ preventScroll: true });
    }

    previous.addEventListener("click", () => go(-1));
    next.addEventListener("click", () => go(1));
    document.addEventListener("keydown", event => {
      const target = event.target;
      if (target.matches("input, textarea, select, button")) return;
      if (event.key === "ArrowRight" || event.key === "PageDown") { event.preventDefault(); go(1); }
      if (event.key === "ArrowLeft" || event.key === "PageUp") { event.preventDefault(); go(-1); }
      if (event.key === "Home") { state.slide = 0; save(); render(); }
      if (event.key === "End") { state.slide = totalSlides - 1; save(); render(); }
    });

    render();
  </script>
</body>
</html>
